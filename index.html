<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHINHATI // Steam Library</title><meta name="theme-color" content="#101820"><style>

</style></head><body><div class="shell"><header class="topbar"><label class="search"><b>⌕</b><input id="search" type="search" placeholder="Szukaj gier..." autocomplete="off"></label><nav class="tabs" id="tabs"></nav><div class="user"><div class="completion-summary" id="completion-summary" aria-label="Postęp ukończenia biblioteki" title="Postęp ukończenia biblioteki"><div class="completion-heading"><span id="completion-count">—</span><strong id="completion-percent">0%</strong></div><div class="completion-track" id="completion-track" role="progressbar" aria-label="Ukończone gry" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="completion-fill" id="completion-fill"></div></div></div><span class="dot">●</span><span class="clock" id="clock">--:--</span><a href="https://steamcommunity.com/id/jonthekinginthenorth/" target="_blank" rel="noopener"><div class="profile"><img id="avatar" alt="Avatar Steam" hidden><span id="avatarFallback">J</span></div></a></div></header><div class="line"><div><h1 id="section">WSZYSTKIE GRY</h1><p id="sub">Domyślne sortowanie: nazwa A–Z.</p></div><div class="controls"><label class="upcoming-toggle"><input id="hideUpcoming" type="checkbox"><span>UKRYJ PRZED PREMIERĄ</span></label><label class="sort"><span>SORTUJ</span><select id="sort"><option value="az" selected>NAZWA A–Z</option><option value="za">NAZWA Z–A</option><option value="rating">OCENA ↓</option></select></label></div></div><main class="grid" id="grid"></main></div><script src="games.js"></script><script src="library-data.js"></script><script src="playstation-games.js"></script><script src="library-config.js"></script><script>
(()=>{const hidden=new Set((window.STEAM_HIDDEN_APPIDS||[]).map(Number)),games=(Array.isArray(window.STEAM_GAMES)?window.STEAM_GAMES:[]).filter(g=>!hidden.has(g.appid)),grid=document.getElementById('grid'),tabs=document.getElementById('tabs'),search=document.getElementById('search'),sort=document.getElementById('sort'),hideUpcoming=document.getElementById('hideUpcoming'),section=document.getElementById('section'),sub=document.getElementById('sub');let active='all';const playstationGames=(Array.isArray(window.PLAYSTATION_GAMES)?window.PLAYSTATION_GAMES:[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));const playstationWishlist=(Array.isArray(window.PLAYSTATION_WISHLIST)?window.PLAYSTATION_WISHLIST:[]).filter(g=>!playstationGames.some(p=>p.physical&&p.name.toLocaleLowerCase('pl')===g.name.toLocaleLowerCase('pl'))).slice().sort((a,b)=>a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));const name=g=>g.name;const status=g=>{if(Number(g.appid)===2638890||Number(g.appid)===1636440||Number(g.appid)===1817190)return 'done';const d=window.STEAM_RELEASE_DATES&&window.STEAM_RELEASE_DATES[g.appid];if(d&&Date.now()<Date.parse(d))return 'up';return(window.STEAM_STATUSES&&window.STEAM_STATUSES[g.appid])||(g.status==='done'?'done':g.status==='upcoming'?'up':'todo')};// Tylko gry z potwierdzonym 100% osiagniec Steam (screen uzytkownika). Dodawane recznie, niezaleznie od zielonego statusu.
const showcase100=new Set([1888930,3669870,883710,2050650,418370,1817070,3280350,2651280,2215200,952060,3764200,1817190,1593500,2172010,3768760,1895880]);const defs=[['all','WSZYSTKIE GRY',()=>true]];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rating=v=>{const n=parseFloat(String(v||'').replace('%',''));return Number.isFinite(n)?n:-1};const covers=g=>(window.STEAM_COVERS&&window.STEAM_COVERS[g.appid])?[window.STEAM_COVERS[g.appid]]:[];function img(g){const a=covers(g),f=a.shift();return `<img class="cover" src="${f}" alt="${esc(name(g))}" loading="lazy" data-f='${esc(JSON.stringify(a))}'>`}function tint(g){return status(g)==='done'?'<span class="status-tint done" aria-hidden="true"></span>':''}

function playstationCard(g){const url=esc(g.cover||""),label=esc(g.name);return `<article class="game ps-game" aria-label="${label}" title="${label}"><div class="wrap"><div class="glow" style="background-image:url(&quot;${url}&quot;)"></div><div class="clip"><img class="cover" src="${url}" alt="${label}" loading="lazy" data-f="[]"></div></div></article>`}

const isUpcoming=g=>{const d=window.STEAM_RELEASE_DATES&&window.STEAM_RELEASE_DATES[g.appid];return Boolean(d&&Date.now()<Date.parse(d))};function sortGames(a){a=[...a];if(sort.value==='rating')a.sort((a,b)=>rating(b.rating)-rating(a.rating)||name(a).localeCompare(name(b),'pl',{sensitivity:'base'}));else if(sort.value==='za')a.sort((a,b)=>name(b).localeCompare(name(a),'pl',{sensitivity:'base'}));else a.sort((a,b)=>name(a).localeCompare(name(b),'pl',{sensitivity:'base'}));return a}
function list(){const def=defs.find(d=>d[0]===active)||defs[0],q=search.value.trim().toLocaleLowerCase('pl');let a=games.filter(def[2]);if(hideUpcoming.checked)a=a.filter(g=>!isUpcoming(g));if(q)a=a.filter(g=>name(g).toLocaleLowerCase('pl').includes(q));return sortGames(a)}

sortGames(a);grid.classList.remove('showcase-mode');section.textContent='100% GRY';sub.textContent=a.length+' gier ze wszystkimi osiągnięciami Steam • '+(sort.value==='rating'?'ocena ↓':sort.value==='za'?'nazwa Z–A':'nazwa A–Z');grid.innerHTML=a.length?a.map(g=>card(g,true)).join(''):'<div class="empty">Brak gier z 100% osiągnięć pasujących do wyszukiwania.</div>';wire()}
