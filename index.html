<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINHATI // Steam Library</title>
<meta name="description" content="Biblioteka Steam w stylu Big Picture z trackerem ukończenia gier zapisanym w pliku games.js.">
<meta name="theme-color" content="#171d24">
<style>
:root{
  --bg:#11161c;--bg2:#171d24;--panel:#1c232b;--panel2:#222b35;
  --text:#edf2f7;--muted:#9ca7b2;--muted2:#6f7b87;--line:#313a44;
  --focus:#66a9ff;--focus2:#d8f0ff;--done:#50cf79;--todo:#d2d7dc;--gold:#f3cc52;
}
*{box-sizing:border-box}
html{background:#0d1117;scrollbar-color:#53606d #11161c}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:#11161b;overflow-x:hidden;position:relative;
}
#ambient{position:fixed;inset:-70px;z-index:-2;pointer-events:none;overflow:hidden;background:
  radial-gradient(900px 520px at 0% 100%,rgba(22,99,220,.28),transparent 62%),
  radial-gradient(900px 520px at 100% 100%,rgba(127,44,201,.30),transparent 61%),
  linear-gradient(180deg,#11161b 0%,#171d24 46%,#151b22 100%);transition:background-image .18s ease,opacity .18s ease}
#ambient::before{content:"";position:absolute;inset:-8%;background-image:var(--ambient-image,none);background-size:cover;background-position:center 38%;filter:blur(78px) saturate(1.35) brightness(.78);transform:scale(1.14);opacity:var(--ambient-opacity,0);transition:opacity .18s ease,background-image .18s ease}
#ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,13,18,.64) 0%,rgba(14,19,25,.38) 35%,rgba(12,16,21,.56) 100%),radial-gradient(circle at 50% 42%,rgba(255,255,255,.035),transparent 36%)}
button,input,select{font:inherit}button{color:inherit}
.shell{min-height:100vh;padding:0 52px 72px}
.topbar{
  position:sticky;top:0;z-index:100;
  display:grid;grid-template-columns:minmax(280px,1fr) auto minmax(200px,1fr);align-items:center;gap:24px;
  min-height:78px;padding:16px 0 10px;
  background:linear-gradient(180deg,rgba(17,22,28,.985) 0%,rgba(17,22,28,.94) 72%,rgba(17,22,28,0) 100%);
  backdrop-filter:blur(8px);
}
.search{display:flex;align-items:center;gap:10px;color:#d7dee6;min-width:0}
.search-icon{font-size:25px;line-height:1;transform:rotate(-15deg);opacity:.94}
.search input{width:100%;height:42px;border:0;outline:0;background:transparent;color:#fff;font-size:17px;font-style:italic;font-weight:600}
.search input::placeholder{color:#a4acb5}
.tabs{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.tab{border:0;background:transparent;color:#c3c9cf;cursor:pointer;padding:10px 15px;border-radius:20px;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;transition:.15s}
.tab span{margin-left:6px;color:#6f7983}.tab:hover{color:#fff;background:#2a323c}.tab.active{background:#3b434c;color:#fff}.tab.active span{color:#d1d6db}
.userbox{display:flex;align-items:center;justify-content:flex-end;gap:14px;white-space:nowrap}
.clock{font-weight:900;font-size:15px;color:#e0e4e8}.globe{font-size:16px;color:#d9dfe4}.profile{width:36px;height:36px;border:2px solid #7455de;background:linear-gradient(135deg,#5d3c47,#27262c);display:grid;place-items:center;font:900 17px Georgia,serif;color:#fff;box-shadow:0 0 0 1px #252b31}
.library-line{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 20px;padding-top:5px}
.library-title{min-width:0}.library-title h1{margin:0;font-size:15px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}.library-title p{margin:5px 0 0;color:#8d98a3;font-size:11px}
.sort{display:flex;align-items:center;gap:8px;color:#8f9aa5;font-size:10px;font-weight:800;text-transform:uppercase}.sort select{border:1px solid #39444f;background:#1c232b;color:#dfe5eb;border-radius:3px;padding:7px 9px;outline:none;font-size:11px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:34px 15px;align-items:start;padding:0 0 24px}
.game{position:relative;min-width:0;outline:0;cursor:pointer;transform-origin:50% 56%;transition:transform .15s ease,filter .15s ease,opacity .15s ease;z-index:1}
.cover-wrap{position:relative;aspect-ratio:2/3;background:#0b0f13;overflow:visible;box-shadow:0 7px 19px rgba(0,0,0,.27);transition:.15s}
.cover-clip{position:absolute;inset:0;overflow:hidden;background:#0b0f13}
.cover{width:100%;height:100%;display:block;object-fit:cover;transition:transform .15s ease,filter .15s ease}
.fallback{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:14px;background:linear-gradient(145deg,#29333d,#0d1116);font-size:12px;font-weight:900;color:#dce4ec}
.badge{position:absolute;right:7px;bottom:7px;z-index:5;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:rgba(39,46,55,.96);color:#f5f7f9;box-shadow:0 2px 7px rgba(0,0,0,.48);font-size:14px;border:1px solid rgba(255,255,255,.08)}
.badge.done{background:rgba(39,139,73,.98);color:#fff}.badge.upcoming{background:rgba(79,68,132,.98);color:#fff}.favorite{position:absolute;left:7px;top:7px;z-index:5;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(16,20,25,.94);color:var(--gold);box-shadow:0 2px 7px rgba(0,0,0,.45);font-size:13px}
.hover-info{position:absolute;left:-6px;right:-6px;top:calc(100% + 7px);z-index:8;padding:7px 8px 8px;background:linear-gradient(180deg,rgba(33,43,54,.98),rgba(22,29,36,.98));border:1px solid #5b7897;box-shadow:0 10px 22px rgba(0,0,0,.5);opacity:0;transform:translateY(-4px);pointer-events:none;transition:.13s}
.hover-title{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}.hover-meta{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:#b5bec7;font-size:9px}
.game:hover,.game:focus-visible{z-index:30;transform:scale(1.085)}
.game:hover .cover-wrap,.game:focus-visible .cover-wrap{box-shadow:0 0 0 3px #edf7ff,0 0 0 7px rgba(75,146,232,.9),0 18px 34px rgba(0,0,0,.58)}
.game:hover .cover,.game:focus-visible .cover{transform:scale(1.018)}
.game:hover .hover-info,.game:focus-visible .hover-info{opacity:1;transform:none}
.empty{grid-column:1/-1;padding:110px 20px;text-align:center;color:#9ca7b2;font-size:14px}
.footerbar{position:fixed;left:0;right:0;bottom:0;z-index:120;height:50px;background:linear-gradient(180deg,rgba(28,35,43,.97),rgba(16,22,28,.995));border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;padding:0 48px;color:#c5ccd3;font-size:10px;box-shadow:0 -10px 28px rgba(0,0,0,.18)}
.footer-left,.footer-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.steam-pill{background:#e5e8ea;color:#23282d;border-radius:11px;padding:3px 9px;font-size:9px;font-weight:900;letter-spacing:.06em}.hint{display:flex;align-items:center;gap:5px;font-weight:800}.key{width:20px;height:20px;border-radius:50%;background:#e7e9eb;color:#20252a;display:grid;place-items:center;font-weight:900;font-size:9px}.stats{color:#8f9aa5;font-weight:800;letter-spacing:.04em}
.detail{position:fixed;inset:0;z-index:300;background:rgba(7,10,14,.78);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:28px}.detail.open{display:flex}.detail-card{width:min(920px,94vw);background:linear-gradient(135deg,#28323d 0%,#151b22 75%);border:1px solid #4b5866;box-shadow:0 30px 80px rgba(0,0,0,.7);display:grid;grid-template-columns:230px 1fr;gap:27px;padding:24px}.detail-cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0b0f13}.detail-info{min-width:0}.detail-info h2{margin:2px 0 9px;font-size:27px}.detail-info p{color:#a1acb7;margin:8px 0;font-size:13px}.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.chip{background:#2b3540;border:1px solid #465361;padding:6px 9px;border-radius:3px;color:#d9e1e8;font-size:11px}.chip.done{border-color:#4b9860;color:#8ee8a5}.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.action{border:0;background:#3d82c4;color:#fff;padding:10px 15px;border-radius:3px;font-weight:800;cursor:pointer;text-decoration:none;font-size:12px}.action.secondary{background:#303943}.detail-close{position:absolute;right:24px;top:18px;border:0;background:transparent;color:#fff;font-size:31px;cursor:pointer}
@media(max-width:1200px){.shell{padding-left:28px;padding-right:28px}.topbar{grid-template-columns:minmax(240px,1fr) auto}.tabs{grid-column:1/-1;grid-row:2;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}.userbox{grid-column:2}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:30px 12px}}
@media(max-width:700px){.shell{padding:0 12px 62px}.topbar{grid-template-columns:1fr auto;gap:10px;padding-top:10px}.userbox .globe,.clock{display:none}.tabs{justify-content:flex-start;gap:4px}.tab{padding:9px 11px}.library-line{margin-bottom:14px}.library-title p{display:none}.sort span{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 8px}.footerbar{height:44px;padding:0 10px}.footer-right .optional{display:none}.detail-card{grid-template-columns:110px 1fr;gap:13px;padding:15px}.detail-info h2{font-size:18px}.detail-cover{align-self:start}}
@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.profile{width:32px;height:32px}.search input{font-size:15px}}
</style>
</head>
<body>
<div id="ambient" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar">
    <label class="search"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Szukaj gier lub profili..." autocomplete="off"></label>
    <nav class="tabs" id="tabs" aria-label="Filtry biblioteki"></nav>
    <div class="userbox"><span class="globe">●</span><span class="clock" id="clock">--:--</span><div class="profile" title="shinhati">S</div></div>
  </header>

  <div class="library-line">
    <div class="library-title"><h1 id="sectionTitle">WSZYSTKIE GRY</h1><p id="subline">Statusy są ustawione w pliku games.js — strona niczego nie zapisuje w przeglądarce.</p></div>
    <label class="sort"><span>SORTUJ</span><select id="sort" aria-label="Sortowanie"><option value="hours">CZAS GRY ↓</option><option value="name">NAZWA A–Z</option><option value="rating">OCENA ↓</option></select></label>
  </div>

  <main class="grid" id="grid"></main>
</div>

<footer class="footerbar">
  <div class="footer-left"><span class="steam-pill">STEAM</span><span class="stats" id="stats">0 GIER</span></div>
  <div class="footer-right"><span class="hint optional"><span class="key">X</span> FILTR</span><span class="hint optional"><span class="key">Y</span> SORTUJ</span><span class="hint"><span class="key">A</span> WYBIERZ</span><span class="hint"><span class="key">B</span> WSTECZ</span></div>
</footer>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <button class="detail-close" id="detailClose" aria-label="Zamknij">×</button>
  <div class="detail-card">
    <img class="detail-cover" id="detailCover" alt="">
    <div class="detail-info"><h2 id="detailTitle"></h2><p id="detailMeta"></p><div class="detail-tags" id="detailTags"></div><p>Status gry jest pobierany wyłącznie z <b>games.js</b>. Ta strona nie zmienia go i nie zapisuje niczego lokalnie.</p><div class="detail-actions"><a class="action" id="steamLink" target="_blank" rel="noopener noreferrer">OTWÓRZ W STEAM</a><button class="action secondary" id="closeBtn" type="button">WRÓĆ</button></div></div>
  </div>
</div>

<script src="games.js"></script>
<script>
(()=>{
const games=Array.isArray(window.STEAM_GAMES)?window.STEAM_GAMES:[];
const grid=document.getElementById('grid'),tabs=document.getElementById('tabs'),search=document.getElementById('search'),sort=document.getElementById('sort');
const sectionTitle=document.getElementById('sectionTitle'),stats=document.getElementById('stats');
const detail=document.getElementById('detail'),detailClose=document.getElementById('detailClose'),closeBtn=document.getElementById('closeBtn');
const ambient=document.getElementById('ambient');
let active='all';
let ambientTimer=null;
function setAmbientFromCard(card){const img=card.querySelector('.cover');if(!img)return;clearTimeout(ambientTimer);const src=img.currentSrc||img.src;if(!src)return;ambient.style.setProperty('--ambient-image',`url("${src.replace(/"/g,'%22')}")`);ambient.style.setProperty('--ambient-opacity','.48')}
function clearAmbientSoon(){clearTimeout(ambientTimer);ambientTimer=setTimeout(()=>ambient.style.setProperty('--ambient-opacity','0'),90)}
const hoursValue=v=>{if(!v||v==='-')return -1;const h=String(v).match(/[\d,.]+(?=h)/);if(h)return parseFloat(h[0].replace(/,/g,''));const m=String(v).match(/(\d+)m/);return m?parseInt(m[1],10)/60:0};
const ratingValue=v=>{const n=parseFloat(String(v||'').replace('%',''));return Number.isFinite(n)?n:-1};
const isUpcoming=g=>g.playtime==='-';
const effectiveStatus=g=>isUpcoming(g)?'upcoming':(g.status==='done'?'done':'todo');
const tabDefs=[
  ['all','WSZYSTKIE GRY',()=>true],
  ['todo','DO ZROBIENIA',g=>effectiveStatus(g)==='todo'],
  ['done','UKOŃCZONE',g=>effectiveStatus(g)==='done'],
  ['favorites','ULUBIONE',g=>!!g.favorite],
  ['upcoming','NADCHODZĄCE',g=>effectiveStatus(g)==='upcoming']
];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function counts(){return Object.fromEntries(tabDefs.map(([id,,fn])=>[id,games.filter(fn).length]))}
function renderTabs(){const c=counts();tabs.innerHTML=tabDefs.map(([id,label])=>`<button class="tab${active===id?' active':''}" data-tab="${id}" type="button">${label}<span>${c[id]}</span></button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;render()}))}
function candidates(g){return [
  `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${g.appid}/library_600x900.jpg`,
  `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/library_600x900.jpg`,
  `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${g.appid}/library_600x900.jpg`,
  `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${g.appid}/library_capsule.jpg`
]}
function coverImg(g,cls='cover'){const arr=candidates(g);const first=arr.shift();return `<img class="${cls}" src="${first}" alt="${escapeHtml(g.name)}" loading="lazy" data-fallback='${escapeHtml(JSON.stringify(arr))}'>`}
function statusBadge(g){const st=effectiveStatus(g);if(st==='done')return '<span class="badge done" title="Ukończona">✓</span>';if(st==='upcoming')return '<span class="badge upcoming" title="Nadchodząca">◷</span>';return '<span class="badge" title="Do zrobienia">🎮</span>'}
function gameCard(g){return `<article class="game" tabindex="0" data-appid="${g.appid}" aria-label="${escapeHtml(g.name)}"><div class="cover-wrap"><div class="cover-clip">${coverImg(g)}</div>${g.favorite?'<span class="favorite" title="Ulubiona">★</span>':''}${statusBadge(g)}</div><div class="hover-info"><div class="hover-title">${escapeHtml(g.name)}</div><div class="hover-meta"><span>${escapeHtml(g.playtime==='-'?'NADCHODZĄCA':g.playtime)}</span><span>${escapeHtml(g.rating==='-'?'':g.rating)}</span></div></div></article>`}
function filtered(){const def=tabDefs.find(x=>x[0]===active)||tabDefs[0];const q=search.value.trim().toLocaleLowerCase('pl');let arr=games.filter(def[2]);if(q)arr=arr.filter(g=>g.name.toLocaleLowerCase('pl').includes(q));arr=[...arr];if(sort.value==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));else if(sort.value==='rating')arr.sort((a,b)=>ratingValue(b.rating)-ratingValue(a.rating)||a.name.localeCompare(b.name,'pl'));else arr.sort((a,b)=>hoursValue(b.playtime)-hoursValue(a.playtime)||a.name.localeCompare(b.name,'pl'));return arr}
function wireFallbacks(){grid.querySelectorAll('img[data-fallback]').forEach(img=>img.addEventListener('error',function(){let rest=[];try{rest=JSON.parse(img.dataset.fallback||'[]')}catch{}if(rest.length){img.src=rest.shift();img.dataset.fallback=JSON.stringify(rest)}else{const div=document.createElement('div');div.className='fallback';div.textContent=img.alt;img.replaceWith(div)}}))}
function render(){renderTabs();const label=(tabDefs.find(x=>x[0]===active)||tabDefs[0])[1];sectionTitle.textContent=label;const arr=filtered();grid.innerHTML=arr.length?arr.map(gameCard).join(''):'<div class="empty">Brak gier w tym widoku.</div>';wireFallbacks();stats.textContent=`${arr.length} GIER`;grid.querySelectorAll('.game').forEach(card=>{const open=()=>showDetail(Number(card.dataset.appid));card.addEventListener('click',open);card.addEventListener('mouseenter',()=>setAmbientFromCard(card));card.addEventListener('mouseleave',clearAmbientSoon);card.addEventListener('focus',()=>setAmbientFromCard(card));card.addEventListener('blur',clearAmbientSoon);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
function showDetail(appid){const g=games.find(x=>x.appid===appid);if(!g)return;document.getElementById('detailTitle').textContent=g.name;document.getElementById('detailMeta').textContent=`${g.playtime==='-'?'Brak czasu gry':g.playtime+' na koncie'}${g.rating!=='-'?'  •  '+g.rating+' pozytywnych ocen':''}`;const st=effectiveStatus(g);document.getElementById('detailTags').innerHTML=`<span class="chip${st==='done'?' done':''}">${st==='done'?'UKOŃCZONA':st==='upcoming'?'NADCHODZĄCA':'DO ZROBIENIA'}</span><span class="chip">APP ${g.appid}</span>${g.favorite?'<span class="chip">★ ULUBIONA</span>':''}`;const img=document.getElementById('detailCover');const arr=candidates(g);img.src=arr.shift();img.alt=g.name;img.onerror=()=>{if(arr.length)img.src=arr.shift();else img.onerror=null};document.getElementById('steamLink').href=`https://store.steampowered.com/app/${g.appid}/`;detail.classList.add('open');document.body.style.overflow='hidden'}
function closeDetail(){detail.classList.remove('open');document.body.style.overflow=''}
detailClose.addEventListener('click',closeDetail);closeBtn.addEventListener('click',closeDetail);detail.addEventListener('click',e=>{if(e.target===detail)closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detail.classList.contains('open'))closeDetail()});
search.addEventListener('input',render);sort.addEventListener('change',render);
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);
render();
})();
</script>
</body>
</html>
