<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHINHATI // Steam Library</title><meta name="theme-color" content="#101820"><style>
:root{--bg:#101820;--panel:#182432;--text:#edf4fb;--muted:#90a4b8;--done:#58c33d;--todo:#d3a126;--up:#7756d5;--ease:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html{background:#0b1117}body{margin:0;min-height:100vh;background:radial-gradient(1000px 520px at 20% 100%,#172b42 0,transparent 60%),linear-gradient(#0d141c,#111b25);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;overflow-x:hidden}button,input,select{font:inherit}button{color:inherit}a{color:inherit;text-decoration:none}.shell{min-height:100vh;padding:0 50px 35px}.topbar{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:minmax(250px,1fr) auto minmax(180px,1fr);align-items:center;gap:22px;min-height:82px;padding:16px 0 10px;background:linear-gradient(180deg,rgba(12,19,27,.98) 0%,rgba(12,19,27,.94) 72%,rgba(12,19,27,0) 100%);backdrop-filter:blur(10px)}.search{display:flex;gap:10px;align-items:center}.search b{font-size:22px;transform:rotate(-14deg)}.search input{width:100%;height:42px;border:0;outline:0;background:transparent;color:#fff;font-size:17px;font-weight:600;font-style:italic}.search input::placeholder{color:#8fa3b7}.tabs{display:flex;gap:8px;white-space:nowrap}.tab{border:0;background:transparent;padding:10px 15px;border-radius:999px;cursor:pointer;color:#b5c3d1;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;transition:.2s}.tab span{margin-left:6px;color:#748ba0}.tab:hover{background:#26384a;color:#fff}.tab.active{background:linear-gradient(#465f79,#304357);color:#fff}.tab.active span{color:#dce8f3}.user{display:flex;align-items:center;justify-content:flex-end;gap:13px}.clock{font-size:15px;font-weight:900}.dot{font-size:15px;color:#b9cede}.profile{width:40px;height:40px;overflow:hidden;border:1px solid #6e879f;background:#24364a;display:grid;place-items:center}.profile img{width:100%;height:100%;object-fit:cover;display:block}.profile span{font:900 17px Georgia,serif}.line{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:5px 0 18px}.line h1{margin:0;font-size:15px;letter-spacing:.05em}.line p{margin:5px 0 0;color:#8297ab;font-size:11px}.sort{display:flex;gap:8px;align-items:center;color:#8fa5b9;font-size:10px;font-weight:800}.sort select{border:1px solid rgba(255,255,255,.1);background:#1c2a38;color:#e8f0f7;padding:8px 10px;border-radius:3px;outline:none;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:32px 18px;align-items:start;padding:10px 0 24px;position:relative}.game{position:relative;outline:0;cursor:pointer;transform-origin:50% 58%;transition:transform .27s var(--ease);z-index:1}.wrap{position:relative;aspect-ratio:2/3;overflow:visible}.glow{position:absolute;inset:-5% -4% -8%;z-index:0;background:center/cover no-repeat;filter:blur(13px) saturate(1.15) brightness(.86);opacity:0;transform:scale(.97);transition:.27s var(--ease);pointer-events:none}.clip{position:absolute;inset:0;overflow:hidden;border-radius:1px;background:#0b0f13;box-shadow:0 8px 22px rgba(0,0,0,.34);z-index:2;transition:box-shadow .27s var(--ease)}.cover{width:100%;height:100%;object-fit:cover;display:block;transition:transform .27s var(--ease),filter .27s var(--ease)}.game:hover,.game:focus-visible{z-index:60;transform:translateY(-4px) scale(1.055)}.game:hover .glow,.game:focus-visible .glow{opacity:.38;transform:scale(1.01)}.game:hover .clip,.game:focus-visible .clip{box-shadow:0 0 0 1px rgba(255,255,255,.38),0 16px 30px rgba(0,0,0,.58)}.game:hover .cover,.game:focus-visible .cover{transform:scale(1.018);filter:saturate(1.04)}.badge{position:absolute;left:8px;bottom:8px;z-index:5;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.14)}.badge svg{width:17px;height:17px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.done{background:var(--done)}.todo{background:var(--todo)}.up{background:var(--up)}.fallback{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:12px;background:linear-gradient(145deg,#29333d,#0d1116);font-size:12px;font-weight:900}.empty{grid-column:1/-1;padding:100px 20px;text-align:center;color:#94a7ba}.modal{position:fixed;inset:0;z-index:300;display:none;place-items:center;padding:28px;background:rgba(5,9,14,.78);backdrop-filter:blur(12px)}.modal.open{display:grid}.card{width:min(900px,94vw);display:grid;grid-template-columns:220px 1fr;gap:26px;padding:23px;background:linear-gradient(135deg,#243548,#14202b);border:1px solid rgba(255,255,255,.1);box-shadow:0 28px 70px rgba(0,0,0,.7)}.card>img{width:100%;aspect-ratio:2/3;object-fit:cover}.info h2{margin:2px 0 10px;font-size:27px}.info p{color:#a9bbcc;font-size:13px;line-height:1.5}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{padding:6px 9px;background:#2b3a4b;border:1px solid rgba(255,255,255,.08);font-size:11px}.actions{display:flex;gap:9px;margin-top:22px}.action{border:0;padding:10px 14px;background:#3f7fba;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#314152}.close{position:absolute;right:24px;top:18px;border:0;background:transparent;font-size:31px;cursor:pointer}@media(max-width:1050px){.shell{padding-left:26px;padding-right:26px}.topbar{grid-template-columns:minmax(220px,1fr) auto}.tabs{grid-column:1/-1;grid-row:2;justify-content:flex-start;overflow:auto}.user{grid-column:2}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:28px 12px}}@media(max-width:680px){.shell{padding:0 12px 25px}.topbar{grid-template-columns:1fr auto}.clock,.dot{display:none}.line p{display:none}.sort>span{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 9px}.card{grid-template-columns:105px 1fr;gap:13px;padding:15px}.info h2{font-size:18px}}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="shell"><header class="topbar"><label class="search"><b>⌕</b><input id="search" type="search" placeholder="Szukaj gier..." autocomplete="off"></label><nav class="tabs" id="tabs"></nav><div class="user"><span class="dot">●</span><span class="clock" id="clock">--:--</span><a href="https://steamcommunity.com/id/jonthekinginthenorth/" target="_blank" rel="noopener"><div class="profile"><img id="avatar" alt="Avatar Steam" hidden><span id="avatarFallback">J</span></div></a></div></header><div class="line"><div><h1 id="section">WSZYSTKIE GRY</h1><p id="sub">Domyślne sortowanie: nazwa A–Z.</p></div><label class="sort"><span>SORTUJ</span><select id="sort"><option value="az" selected>NAZWA A–Z</option><option value="za">NAZWA Z–A</option><option value="rating">OCENA ↓</option></select></label></div><main class="grid" id="grid"></main></div><div class="modal" id="modal"><button class="close" id="x">×</button><div class="card"><img id="detailCover" alt=""><div class="info"><h2 id="title"></h2><p id="meta"></p><div class="chips" id="chips"></div><div class="actions"><a class="action" id="steam" target="_blank" rel="noopener">OTWÓRZ W STEAM</a><button class="action secondary" id="back">WRÓĆ</button></div></div></div></div><script src="games.js"></script><script src="library-data.js"></script><script src="library-config.js"></script><script>
(()=>{const hidden=new Set((window.STEAM_HIDDEN_APPIDS||[]).map(Number)),games=(Array.isArray(window.STEAM_GAMES)?window.STEAM_GAMES:[]).filter(g=>!hidden.has(g.appid)),grid=document.getElementById('grid'),tabs=document.getElementById('tabs'),search=document.getElementById('search'),sort=document.getElementById('sort'),section=document.getElementById('section'),sub=document.getElementById('sub'),modal=document.getElementById('modal');let active='all';const name=g=>g.name;const status=g=>{const d=window.STEAM_RELEASE_DATES&&window.STEAM_RELEASE_DATES[g.appid];if(d&&Date.now()<Date.parse(d))return 'up';return(window.STEAM_STATUSES&&window.STEAM_STATUSES[g.appid])||(g.status==='done'?'done':g.status==='upcoming'?'up':'todo')};const defs=[['all','WSZYSTKIE GRY',()=>true],['done','UKOŃCZONE',g=>status(g)==='done'],['not','NIEUKOŃCZONE',g=>status(g)!=='done']];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rating=v=>{const n=parseFloat(String(v||'').replace('%',''));return Number.isFinite(n)?n:-1};const covers=g=>(window.STEAM_COVERS&&window.STEAM_COVERS[g.appid])?[window.STEAM_COVERS[g.appid]]:[];function img(g){const a=covers(g),f=a.shift();return `<img class="cover" src="${f}" alt="${esc(name(g))}" loading="lazy" data-f='${esc(JSON.stringify(a))}'>`}function badge(g){const s=status(g);if(s==='done')return '<span class="badge done"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>';if(s==='up')return '<span class="badge up"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg></span>';return '<span class="badge todo"><svg viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"/></svg></span>'}function card(g){const glow=covers(g)[0];return `<article class="game" tabindex="0" data-id="${g.appid}" aria-label="${esc(name(g))}"><div class="wrap"><div class="glow" style="background-image:url('${glow}')"></div><div class="clip">${img(g)}</div>${badge(g)}</div></article>`}function list(){const def=defs.find(d=>d[0]===active)||defs[0],q=search.value.trim().toLocaleLowerCase('pl');let a=games.filter(def[2]);if(q)a=a.filter(g=>name(g).toLocaleLowerCase('pl').includes(q));a=[...a];if(sort.value==='rating')a.sort((a,b)=>rating(b.rating)-rating(a.rating)||name(a).localeCompare(name(b),'pl',{sensitivity:'base'}));else if(sort.value==='za')a.sort((a,b)=>name(b).localeCompare(name(a),'pl',{sensitivity:'base'}));else a.sort((a,b)=>name(a).localeCompare(name(b),'pl',{sensitivity:'base'}));return a}function renderTabs(){const count=Object.fromEntries(defs.map(d=>[d[0],games.filter(d[2]).length]));tabs.innerHTML=defs.map(d=>`<button class="tab${active===d[0]?' active':''}" data-t="${d[0]}">${d[1]}<span>${count[d[0]]}</span></button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.t;render()})}function wire(){grid.querySelectorAll('img[data-f]').forEach(i=>i.onerror=()=>{let a=[];try{a=JSON.parse(i.dataset.f||'[]')}catch{}if(a.length){i.src=a.shift();i.dataset.f=JSON.stringify(a)}else{const d=document.createElement('div');d.className='fallback';d.textContent=i.alt;i.replaceWith(d)}});grid.querySelectorAll('.game').forEach(c=>{const open=()=>show(+c.dataset.id);c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}function render(){renderTabs();section.textContent=(defs.find(d=>d[0]===active)||defs[0])[1];const a=list();sub.textContent=search.value.trim()?`Znaleziono ${a.length} z ${games.length} gier.`:`${a.length} gier • domyślne sortowanie: nazwa A–Z.`;grid.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Brak gier w tym widoku.</div>';wire()}function show(id){const g=games.find(x=>x.appid===id);if(!g)return;title.textContent=name(g);meta.textContent=g.rating&&g.rating!=='-'?`${g.rating} pozytywnych ocen`:'';const s=status(g);chips.innerHTML=`<span class="chip">${s==='done'?'UKOŃCZONA':s==='up'?'NADCHODZĄCA':'DO SKOŃCZENIA'}</span><span class="chip">APP ${g.appid}</span>`;const a=covers(g),im=document.getElementById('detailCover');im.src=a.shift();im.alt=name(g);im.onerror=()=>{if(a.length)im.src=a.shift()};steam.href=`https://store.steampowered.com/app/${g.appid}/`;modal.classList.add('open');document.body.style.overflow='hidden'}function close(){modal.classList.remove('open');document.body.style.overflow=''}x.onclick=close;back.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};search.oninput=render;sort.onchange=render;function tick(){clock.textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);async function avatar(){const im=document.getElementById('avatar'),fb=document.getElementById('avatarFallback'),url='https://steamcommunity.com/id/jonthekinginthenorth/?xml=1',set=t=>{const x=new DOMParser().parseFromString(t,'text/xml').querySelector('avatarFull')?.textContent?.trim();if(x){im.src=x;im.hidden=false;fb.hidden=true;im.onerror=()=>{im.hidden=true;fb.hidden=false};return true}};try{const r=await fetch(url);if(r.ok&&set(await r.text()))return}catch{}try{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));if(r.ok)set(await r.text())}catch{}}avatar();render()})();
</script></body></html>
