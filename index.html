<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHINHATI // Steam &amp; PlayStation</title><meta name="theme-color" content="#101820"><style>
:root{--bg:#101820;--panel:#182432;--text:#edf4fb;--muted:#90a4b8;--done:#58c33d;--todo:#d3a126;--up:#7756d5;--ease:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html{background:#0b1117}body{margin:0;min-height:100vh;background:radial-gradient(1000px 520px at 20% 100%,#172b42 0,transparent 60%),linear-gradient(#0d141c,#111b25);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;overflow-x:hidden}button,input,select{font:inherit}button{color:inherit}a{color:inherit;text-decoration:none}.shell{min-height:100vh;padding:0 50px 35px}.topbar{position:sticky;top:0;z-index:120;display:grid;grid-template-columns:minmax(250px,1fr) auto minmax(180px,1fr);align-items:center;gap:22px;min-height:82px;padding:16px 0 10px;background:linear-gradient(180deg,rgba(12,19,27,.99) 0%,rgba(12,19,27,.98) 72%,rgba(12,19,27,.96) 100%);box-shadow:0 8px 18px rgba(6,12,18,.2);backdrop-filter:blur(10px)}.search{display:flex;gap:10px;align-items:center}.search b{font-size:22px;transform:rotate(-14deg)}.search input{width:100%;height:42px;border:0;outline:0;background:transparent;color:#fff;font-size:17px;font-weight:600;font-style:italic}.search input::placeholder{color:#8fa3b7}.tabs{display:flex;gap:8px;white-space:nowrap}.tab{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;padding:10px 15px;border-radius:999px;cursor:pointer;color:#b5c3d1;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;transition:.2s}.tab img{display:block;width:15px;height:15px;flex-shrink:0;object-fit:contain;filter:brightness(0) invert(.75)}.tab:hover img,.tab.active img{filter:brightness(0) invert(1)}.tab span{margin-left:2px;color:#748ba0}.tab:hover{background:#26384a;color:#fff}.tab.active{background:linear-gradient(#465f79,#304357);color:#fff}.tab.active span{color:#dce8f3}.user{display:flex;align-items:center;justify-content:flex-end;gap:13px}.clock{font-size:15px;font-weight:900}.dot{font-size:15px;color:#b9cede}.profile{width:40px;height:40px;overflow:hidden;border:1px solid #6e879f;background:#24364a;display:grid;place-items:center}.profile img{width:100%;height:100%;object-fit:cover;display:block}.profile span{font:900 17px Georgia,serif}.line{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:5px 0 18px}.line h1{margin:0;font-size:15px;letter-spacing:.05em}.line p{margin:5px 0 0;color:#8297ab;font-size:11px}.controls{display:flex;gap:14px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:32px 18px;align-items:start;padding:10px 0 24px;position:relative}.game{position:relative;outline:0;cursor:default;transform-origin:50% 58%;transition:transform .27s var(--ease);z-index:1}.wrap{position:relative;aspect-ratio:2/3;overflow:visible}.glow{position:absolute;inset:-5% -4% -8%;z-index:0;background:center/cover no-repeat;filter:blur(13px) saturate(1.15) brightness(.86);opacity:0;transform:scale(.97);transition:.27s var(--ease);pointer-events:none}.clip{position:absolute;inset:0;overflow:hidden;border-radius:1px;background:#0b0f13;box-shadow:0 8px 22px rgba(0,0,0,.34);z-index:2;transition:box-shadow .27s var(--ease)}.cover{width:100%;height:100%;object-fit:cover;display:block;transition:transform .27s var(--ease),filter .27s var(--ease)}.game:hover,.game:focus-visible{z-index:60;transform:translateY(-4px) scale(1.055)}.game:hover .glow,.game:focus-visible .glow{opacity:.38;transform:scale(1.01)}.game:hover .clip,.game:focus-visible .clip{box-shadow:0 0 0 1px rgba(255,255,255,.16),0 16px 30px rgba(0,0,0,.58)}.game:hover .cover,.game:focus-visible .cover{transform:scale(1.018);filter:saturate(1.04)}.game:hover .status-tint,.game:focus-visible .status-tint{filter:brightness(1.02);opacity:.96}.status-tint{position:absolute;inset:0;z-index:3;pointer-events:none;border:4px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:opacity .27s var(--ease),filter .27s var(--ease),transform .27s var(--ease),border-color .27s var(--ease),background-color .27s var(--ease)}.status-tint.done{background:rgba(46,194,84,.68);border-color:#2cd45b}.fallback{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:12px;background:linear-gradient(145deg,#29333d,#0d1116);font-size:12px;font-weight:900}.empty{grid-column:1/-1;padding:100px 20px;text-align:center;color:#94a7ba}@media(max-width:1050px){.shell{padding-left:26px;padding-right:26px}.topbar{grid-template-columns:minmax(220px,1fr) auto}.tabs{grid-column:1/-1;grid-row:2;justify-content:flex-start;overflow:auto}.user{grid-column:2}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:28px 12px}}@media(max-width:680px){.shell{padding:0 12px 25px}.topbar{grid-template-columns:1fr auto}.clock,.dot{display:none}.line p{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 9px}}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Przelacznik zielonych nakladek Steam - domyslnie wylaczony; bez zapisu w przegladarce. */
.green-switch{display:inline-flex;align-items:center;gap:11px;white-space:nowrap;color:#b5c7d8;font-size:11px;font-weight:800;letter-spacing:.055em;user-select:none;cursor:pointer}
.green-switch input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.green-switch .switch-track{position:relative;display:inline-flex;align-items:center;width:45px;height:25px;flex:none;border:1px solid #405569;border-radius:999px;background:#1c2d3b;box-shadow:inset 0 1px 3px rgba(0,0,0,.4);transition:background .2s,border-color .2s,box-shadow .2s}
.green-switch .switch-knob{position:absolute;left:3px;width:17px;height:17px;border-radius:50%;background:#d1dce6;box-shadow:0 1px 4px rgba(0,0,0,.45);transition:transform .2s,background .2s}
.green-switch input:checked+.switch-track{background:#225c43;border-color:#37a870;box-shadow:0 0 0 1px rgba(51,175,108,.17),inset 0 1px 3px rgba(0,0,0,.2)}
.green-switch input:checked+.switch-track .switch-knob{transform:translateX(20px);background:#aaf0bd}
.green-switch input:focus-visible+.switch-track{outline:2px solid #b8dcff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.green-switch .switch-knob,.green-switch .switch-track{transition:none}}
/* Czytelne, wieksze kafelki Steam; PlayStation ma wlasna siatke ponizej. */
@media(min-width:1601px){.grid:not(.playstation-mode){grid-template-columns:repeat(12,minmax(0,1fr));gap:26px 14px}}
@media(min-width:1051px) and (max-width:1600px){.grid:not(.playstation-mode){grid-template-columns:repeat(10,minmax(0,1fr));gap:24px 12px}}
@media(min-width:681px) and (max-width:1050px){.grid:not(.playstation-mode){grid-template-columns:repeat(7,minmax(0,1fr));gap:22px 10px}}
/* Sekcja zapowiedzianych gier Steam zawsze pod wydanymi. */
.steam-section-heading{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin-top:28px;padding:25px 0 4px;border-top:1px solid rgba(177,204,226,.18)}
.steam-section-heading strong{font-size:15px;letter-spacing:.07em;font-weight:900;color:#e5effa}

@media(max-width:680px){.green-switch{font-size:10px;gap:8px}.steam-section-heading{margin-top:16px;padding-top:20px}.steam-section-heading strong{font-size:12px}}

/* Kompaktowy pasek ukonczenia, obok zegara w naglowku. */
.completion-summary{flex:0 0 128px;width:128px;padding:6px 8px;border:1px solid rgba(151,186,204,.13);border-radius:7px;background:rgba(24,37,49,.67);color:#d7e7f1}
.completion-heading{display:flex;align-items:baseline;justify-content:space-between;gap:7px;white-space:nowrap}
.completion-heading span{font-size:10px;font-weight:700;letter-spacing:.01em;color:#9eb2c2;font-variant-numeric:tabular-nums}
.completion-heading strong{font-size:12px;font-weight:900;color:#a3eeb4;font-variant-numeric:tabular-nums}
.completion-track{height:4px;margin-top:5px;border-radius:99px;overflow:hidden;background:rgba(4,11,16,.8)}
.completion-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3dbb6d,#8de9a4);transition:width .6s var(--ease)}
@media(max-width:680px){.topbar{gap:10px}.user{gap:8px}.completion-summary{flex-basis:100px;width:100px;padding:6px}.completion-heading span{font-size:9px}.completion-heading strong{font-size:11px}}
@media(prefers-reduced-motion:reduce){.completion-fill{transition:none}}
/* Oddzielna galeria PlayStation z duzymi okladkami 1:1. */
.grid.playstation-mode{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:28px 20px}
.grid.playstation-mode .wrap{aspect-ratio:1/1}
.grid.playstation-mode .clip{border-radius:7px}
.grid.playstation-mode .game{cursor:default}

@media(max-width:680px){.grid.playstation-mode{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}}

/* Trzy stale sekcje PlayStation: fizyczne, pozostale posiadane i planowane zakupy. */
.ps-section-heading{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin-top:26px;padding:26px 0 3px;border-top:1px solid rgba(177,204,226,.18)}
.ps-section-heading:first-child{margin-top:0;padding-top:5px;border-top:0}
.ps-section-heading strong{font-size:15px;letter-spacing:.075em;font-weight:900;color:#e5effa}
.ps-section-heading span{font-size:12px;font-weight:800;color:#8aa6be;font-variant-numeric:tabular-nums}
.grid.playstation-mode .ps-wishlist-game{cursor:default}
.grid.playstation-mode .ps-wishlist-game .clip{box-shadow:0 8px 22px rgba(0,0,0,.34),0 0 0 1px rgba(146,182,218,.34)}
.grid.playstation-mode .ps-wishlist-game:hover .clip{box-shadow:0 0 0 1px rgba(190,218,245,.65),0 16px 30px rgba(0,0,0,.58)}
@media(max-width:680px){.ps-section-heading{margin-top:12px;padding-top:20px}.ps-section-heading:first-child{padding-top:5px}.ps-section-heading strong{font-size:12px}.ps-section-heading span{font-size:11px}}
</style></head><body><div class="shell"><header class="topbar"><label class="search"><b>⌕</b><input id="search" type="search" placeholder="Szukaj gier..." autocomplete="off"></label><nav class="tabs" id="tabs"></nav><div class="user"><div class="completion-summary" id="completion-summary" aria-label="Postęp ukończenia biblioteki" title="Postęp ukończenia biblioteki"><div class="completion-heading"><span id="completion-count">—</span><strong id="completion-percent">0%</strong></div><div class="completion-track" id="completion-track" role="progressbar" aria-label="Ukończone gry" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="completion-fill" id="completion-fill"></div></div></div><span class="dot">●</span><span class="clock" id="clock">--:--</span><a href="https://steamcommunity.com/id/jonthekinginthenorth/" target="_blank" rel="noopener"><div class="profile"><img id="avatar" alt="Avatar Steam" hidden><span id="avatarFallback">J</span></div></a></div></header><div class="line"><div><h1 id="section">STEAM</h1><p id="sub">Domyślne sortowanie: nazwa A–Z.</p></div><div class="controls"><label class="green-switch"><span>ZIELONE OKŁADKI</span><input id="greenCovers" type="checkbox" aria-label="Pokaż zielone nakładki ukończonych gier"><span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span></label></div></div><main class="grid" id="grid"></main></div><script src="games.js"></script><script src="library-data.js"></script><script src="playstation-games.js"></script><script src="library-config.js"></script><script>
(()=>{const hidden=new Set((window.STEAM_HIDDEN_APPIDS||[]).map(Number)),games=(Array.isArray(window.STEAM_GAMES)?window.STEAM_GAMES:[]).filter(g=>!hidden.has(g.appid)),grid=document.getElementById('grid'),tabs=document.getElementById('tabs'),search=document.getElementById('search'),greenCovers=document.getElementById('greenCovers'),section=document.getElementById('section'),sub=document.getElementById('sub');let active='all';const playstationGames=(Array.isArray(window.PLAYSTATION_GAMES)?window.PLAYSTATION_GAMES:[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));const playstationWishlist=(Array.isArray(window.PLAYSTATION_WISHLIST)?window.PLAYSTATION_WISHLIST:[]).filter(g=>!playstationGames.some(p=>p.physical&&p.name.toLocaleLowerCase('pl')===g.name.toLocaleLowerCase('pl'))).slice().sort((a,b)=>a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));const name=g=>g.name;const status=g=>{if(Number(g.appid)===2638890||Number(g.appid)===1636440||Number(g.appid)===1817190)return 'done';const d=window.STEAM_RELEASE_DATES&&window.STEAM_RELEASE_DATES[g.appid];if(d&&Date.now()<Date.parse(d))return 'up';return(window.STEAM_STATUSES&&window.STEAM_STATUSES[g.appid])||(g.status==='done'?'done':g.status==='upcoming'?'up':'todo')};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const covers=g=>(window.STEAM_COVERS&&window.STEAM_COVERS[g.appid])?[window.STEAM_COVERS[g.appid]]:[];function img(g){const a=covers(g),f=a.shift();return `<img class="cover" src="${f}" alt="${esc(name(g))}" loading="lazy" data-f='${esc(JSON.stringify(a))}'>`}function tint(g){return greenCovers.checked&&status(g)==='done'?'<span class="status-tint done" aria-hidden="true"></span>':''}
function card(g){const glow=covers(g)[0];return `<article class="game" aria-label="${esc(name(g))}"><div class="wrap"><div class="glow" style="background-image:url('${glow}')"></div><div class="clip">${img(g)}${tint(g)}</div></div></article>`}
function playstationCard(g){const url=esc(g.cover||""),label=esc(g.name);return `<article class="game ps-game" aria-label="${label}" title="${label}"><div class="wrap"><div class="glow" style="background-image:url(&quot;${url}&quot;)"></div><div class="clip"><img class="cover" src="${url}" alt="${label}" loading="lazy" data-f="[]"></div></div></article>`}
function playstationWishlistCard(g){const url=esc(g.cover||""),date=g.releaseDate?new Date(g.releaseDate+"T12:00:00").toLocaleDateString("pl-PL"):"",label=esc(g.name+" — do kupienia na plycie"+(date?" — premiera "+date:""));return `<article class="game ps-wishlist-game" aria-label="${label}" title="${label}"><div class="wrap"><div class="glow" style="background-image:url(&quot;${url}&quot;)"></div><div class="clip"><img class="cover" src="${url}" alt="${esc(g.name)}" loading="lazy" data-f="[]"></div></div></article>`}
const isUpcoming=g=>{const d=window.STEAM_RELEASE_DATES&&window.STEAM_RELEASE_DATES[g.appid];return d?Date.now()<Date.parse(d):g.status==='upcoming'};const alphabetical=a=>[...a].sort((a,b)=>name(a).localeCompare(name(b),'pl',{sensitivity:'base'}))
function list(){const q=search.value.trim().toLocaleLowerCase('pl');return alphabetical(q?games.filter(g=>name(g).toLocaleLowerCase('pl').includes(q)):games)}
function renderTabs(){const steamCount=games.length;const items=[['all','STEAM',steamCount,'https://www.svgrepo.com/show/473800/steam.svg'],['playstation','PLAYSTATION',playstationGames.length,'https://www.svgrepo.com/show/473754/playstation.svg']];tabs.innerHTML=items.map(d=>`<button class="tab${active===d[0]?' active':''}" data-t="${d[0]}" aria-pressed="${active===d[0]}"><img src="${d[3]}" alt="" aria-hidden="true" loading="lazy">${d[1]}<span>${d[2]}</span></button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.t;render()})}function wire(){grid.querySelectorAll('img[data-f]').forEach(i=>i.onerror=()=>{let a=[];try{a=JSON.parse(i.dataset.f||'[]')}catch{}if(a.length){i.src=a.shift();i.dataset.f=JSON.stringify(a)}else{const d=document.createElement('div');d.className='fallback';d.textContent=i.alt;i.replaceWith(d)}})}function renderCompletionProgress(){const released=games.filter(g=>!isUpcoming(g));const total=released.length;const done=released.filter(g=>status(g)==='done').length;const remaining=total-done;const pct=total?100*done/total:0;const rounded=Math.round(pct);document.getElementById('completion-count').textContent=done+' / '+total;document.getElementById('completion-percent').textContent=rounded+'%';document.getElementById('completion-summary').title=done+' z '+total+' wydanych gier ukończonych; pozostało '+remaining;document.getElementById('completion-fill').style.width=pct.toFixed(2)+'%';const track=document.getElementById('completion-track');track.setAttribute('aria-valuenow',String(rounded));track.setAttribute('aria-valuetext',done+' z '+total+' gier ukończonych')}function renderPlaystation(){const q=search.value.trim().toLocaleLowerCase('pl');const found=playstationGames.filter(g=>!q||g.name.toLocaleLowerCase('pl').includes(q));const physical=found.filter(g=>g.physical),digital=found.filter(g=>!g.physical),wishlist=playstationWishlist.filter(g=>!q||g.name.toLocaleLowerCase('pl').includes(q));grid.classList.add('playstation-mode');section.textContent='PLAYSTATION';sub.textContent=physical.length+' fizycznych • '+digital.length+' cyfrowych • '+wishlist.length+' do kupienia na płycie';const group=(title,items,makeCard)=>items.length?'<div class="ps-section-heading"><strong>'+title+'</strong><span>'+items.length+' gier</span></div>'+items.map(makeCard).join(''):'';const content=group('WYDANIA FIZYCZNE',physical,playstationCard)+group('WYDANIA CYFROWE',digital,playstationCard)+group('DO KUPIENIA NA PŁYCIE',wishlist,playstationWishlistCard);grid.innerHTML=content||'<div class="empty">Brak gier PlayStation pasujących do wyszukiwania.</div>';wire()}
function render(){renderTabs();renderCompletionProgress();const isPlaystation=active==='playstation';grid.classList.toggle('playstation-mode',isPlaystation);document.querySelector('.controls').style.display=isPlaystation?'none':'flex';search.placeholder=isPlaystation?'Szukaj gier PlayStation...':'Szukaj gier Steam...';if(isPlaystation){renderPlaystation();return;}section.textContent='STEAM';const all=list(),released=all.filter(g=>!isUpcoming(g)),upcoming=all.filter(isUpcoming);sub.textContent=released.length+' wydanych • '+upcoming.length+' przed premierą • nazwa A–Z';const upcomingCards=upcoming.length?'<div class="steam-section-heading"><strong>PRZED PREMIERĄ</strong><span>'+upcoming.length+' gier</span></div>'+upcoming.map(card).join(''):'';const html=released.map(card).join('')+upcomingCards;grid.innerHTML=html||'<div class="empty">Brak gier pasujących do wyszukiwania.</div>';wire()}search.oninput=render;greenCovers.onchange=render;function tick(){clock.textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);async function avatar(){const im=document.getElementById('avatar'),fb=document.getElementById('avatarFallback'),url='https://steamcommunity.com/id/jonthekinginthenorth/?xml=1',set=t=>{const x=new DOMParser().parseFromString(t,'text/xml').querySelector('avatarFull')?.textContent?.trim();if(x){im.src=x;im.hidden=false;fb.hidden=true;im.onerror=()=>{im.hidden=true;fb.hidden=false};return true}};try{const r=await fetch(url);if(r.ok&&set(await r.text()))return}catch{}try{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));if(r.ok)set(await r.text())}catch{}}avatar();render()})();
