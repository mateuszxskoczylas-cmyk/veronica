<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINHATI // Steam Library</title>
<meta name="description" content="Biblioteka Steam w stylu Big Picture z trackerem ukończenia gier zapisanym w pliku games.js.">
<meta name="theme-color" content="#101821">
<style>
:root{
  --bg:#0f151c;
  --bg2:#16202c;
  --panel:#1b2838;
  --panel2:#233448;
  --panel3:#2b3f54;
  --text:#edf4fb;
  --muted:#9fb0c3;
  --muted2:#70859a;
  --line:rgba(255,255,255,.09);
  --focus:#b7ddff;
  --focus2:#5aa9ff;
  --done:#5ec342;
  --gold:#f3cc52;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html{background:#0b1117;scrollbar-color:#4f647a #111821}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:#0f151c;
  overflow-x:hidden;
  position:relative;
}
#ambient{
  position:fixed;
  inset:-90px;
  z-index:-2;
  pointer-events:none;
  overflow:hidden;
  background:
    radial-gradient(1100px 620px at -2% 100%,rgba(36,83,156,.28),transparent 62%),
    radial-gradient(920px 560px at 102% 100%,rgba(65,120,190,.18),transparent 60%),
    linear-gradient(180deg,#0e141b 0%,#121b24 45%,#101821 100%);
  transition:background-image .45s var(--ease),opacity .45s var(--ease);
}
#ambient::before{
  content:"";
  position:absolute;
  inset:-10%;
  background-image:var(--ambient-image,none);
  background-size:cover;
  background-position:center 38%;
  filter:blur(92px) saturate(1.35) brightness(.78);
  transform:scale(1.18);
  opacity:var(--ambient-opacity,0);
  transition:opacity .45s var(--ease),background-image .45s var(--ease);
}
#ambient::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,rgba(7,11,16,.78) 0%,rgba(10,16,24,.42) 38%,rgba(10,16,24,.72) 100%),
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.04),transparent 36%);
}
button,input,select{font:inherit}
button{color:inherit}
.shell{min-height:100vh;padding:0 52px 34px}
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  display:grid;
  grid-template-columns:minmax(280px,1fr) auto minmax(200px,1fr);
  align-items:center;
  gap:24px;
  min-height:86px;
  padding:18px 0 12px;
  background:linear-gradient(180deg,rgba(12,19,27,.985) 0%,rgba(12,19,27,.94) 72%,rgba(12,19,27,0) 100%);
  backdrop-filter:blur(10px);
}
.search{display:flex;align-items:center;gap:10px;color:#d7e5f2;min-width:0}
.search-icon{font-size:24px;line-height:1;transform:rotate(-15deg);opacity:.94}
.search input{
  width:100%;
  height:44px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:17px;
  font-style:italic;
  font-weight:600;
}
.search input::placeholder{color:#95a7bb}
.tabs{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.tab{
  border:0;
  background:transparent;
  color:#b8c7d7;
  cursor:pointer;
  padding:11px 16px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.05em;
  text-transform:uppercase;
  transition:background .22s var(--ease),color .22s var(--ease),transform .22s var(--ease),box-shadow .22s var(--ease);
}
.tab span{margin-left:6px;color:#7890a6}
.tab:hover{color:#fff;background:rgba(58,87,118,.32)}
.tab.active{
  background:linear-gradient(180deg,rgba(70,95,121,.95),rgba(47,66,86,.95));
  color:#fff;
  box-shadow:0 10px 24px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.08);
}
.tab.active span{color:#dce8f3}
.userbox{display:flex;align-items:center;justify-content:flex-end;gap:14px;white-space:nowrap}
.clock{font-weight:900;font-size:15px;color:#dbe8f4}
.globe{font-size:16px;color:#bdd1e4}
.profile{
  width:38px;
  height:38px;
  border:2px solid #5e7fa1;
  background:linear-gradient(135deg,#36506d,#192330);
  display:grid;
  place-items:center;
  font:900 17px Georgia,serif;
  color:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.18);
}
.library-line{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:4px 0 20px;padding-top:4px}
.library-title{min-width:0}
.library-title h1{margin:0;font-size:15px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.library-title p{margin:6px 0 0;color:#8297ac;font-size:11px}
.sort{display:flex;align-items:center;gap:8px;color:#8fa5b9;font-size:10px;font-weight:800;text-transform:uppercase}
.sort select{
  border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(30,46,63,.95),rgba(25,37,50,.95));
  color:#e6eff8;
  border-radius:4px;
  padding:8px 10px;
  outline:none;
  font-size:11px;
  font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:34px 18px;align-items:start;padding:4px 0 24px}
.game{
  position:relative;
  min-width:0;
  outline:0;
  cursor:pointer;
  transform-origin:50% 58%;
  transition:transform .34s var(--ease),filter .34s var(--ease),opacity .34s var(--ease),z-index .01s linear;
  z-index:1;
  will-change:transform;
}
.cover-wrap{
  position:relative;
  aspect-ratio:2/3;
  overflow:visible;
  border-radius:4px;
  isolation:isolate;
}
.color-glow{
  position:absolute;
  inset:-12% -10% -18% -10%;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  filter:blur(28px) saturate(1.35) brightness(.95);
  opacity:0;
  transform:scale(.9);
  transition:opacity .34s var(--ease),transform .34s var(--ease),filter .34s var(--ease);
  z-index:0;
  pointer-events:none;
}
.cover-wrap::after{
  content:"";
  position:absolute;
  left:-8%;
  right:-8%;
  bottom:-10%;
  height:28%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(97,132,170,.28),rgba(42,63,88,.12) 42%,transparent 74%);
  opacity:0;
  transform:scale(.9);
  filter:blur(12px);
  transition:opacity .34s var(--ease),transform .34s var(--ease);
  z-index:0;
  pointer-events:none;
}
.cover-clip{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#0b0f13;
  border-radius:4px;
  box-shadow:0 8px 22px rgba(0,0,0,.34), inset 0 0 0 1px rgba(255,255,255,.03);
  transition:box-shadow .34s var(--ease),transform .34s var(--ease),border-color .34s var(--ease);
  z-index:2;
}
.cover{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .34s var(--ease),filter .34s var(--ease);
}
.fallback{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  padding:14px;
  background:linear-gradient(145deg,#29333d,#0d1116);
  font-size:12px;
  font-weight:900;
  color:#dce4ec;
}
.badge-done{
  position:absolute;
  left:8px;
  bottom:8px;
  z-index:5;
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--done);
  box-shadow:0 10px 20px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.1);
}
.badge-done::before{
  content:"";
  position:absolute;
  left:9px;
  top:8px;
  width:13px;
  height:7px;
  border-left:5px solid #06090d;
  border-bottom:5px solid #06090d;
  transform:rotate(-45deg);
}
.favorite{
  position:absolute;
  right:8px;
  top:8px;
  z-index:5;
  width:28px;
  height:28px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(12,18,25,.92);
  color:var(--gold);
  box-shadow:0 8px 18px rgba(0,0,0,.42);
  font-size:13px;
  border:1px solid rgba(255,255,255,.06);
}
.game:hover,.game:focus-visible{z-index:30;transform:translateY(-8px) scale(1.085)}
.game:hover .color-glow,.game:focus-visible .color-glow{opacity:.88;transform:scale(1.06);filter:blur(26px) saturate(1.42) brightness(1)}
.game:hover .cover-wrap::after,.game:focus-visible .cover-wrap::after{opacity:1;transform:scale(1.06)}
.game:hover .cover-clip,.game:focus-visible .cover-clip{
  box-shadow:0 0 0 2px rgba(220,241,255,.96),0 0 0 5px rgba(82,143,204,.72),0 22px 40px rgba(0,0,0,.6);
}
.game:hover .cover,.game:focus-visible .cover{transform:scale(1.03);filter:saturate(1.05)}
.empty{grid-column:1/-1;padding:110px 20px;text-align:center;color:#9ca7b2;font-size:14px}
.detail{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(6,10,15,.76);
  backdrop-filter:blur(14px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:28px;
}
.detail.open{display:flex}
.detail-card{
  width:min(960px,94vw);
  background:linear-gradient(135deg,#243548 0%,#15202b 70%);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  display:grid;
  grid-template-columns:230px 1fr;
  gap:28px;
  padding:24px;
  border-radius:8px;
}
.detail-cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0b0f13;border-radius:4px}
.detail-info{min-width:0}
.detail-info h2{margin:2px 0 9px;font-size:27px}
.detail-info p{color:#adc0d3;margin:8px 0;font-size:13px;line-height:1.5}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}
.chip{background:#2b3a4b;border:1px solid rgba(255,255,255,.08);padding:6px 9px;border-radius:4px;color:#d9e6f2;font-size:11px}
.chip.done{border-color:#4d9252;color:#9df0a8}
.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
.action{
  border:0;
  background:linear-gradient(180deg,#4d8ec8,#356eab);
  color:#fff;
  padding:11px 16px;
  border-radius:4px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  font-size:12px;
}
.action.secondary{background:linear-gradient(180deg,#364656,#283543)}
.detail-close{position:absolute;right:24px;top:18px;border:0;background:transparent;color:#fff;font-size:31px;cursor:pointer}
@media(max-width:1200px){
  .shell{padding-left:28px;padding-right:28px}
  .topbar{grid-template-columns:minmax(240px,1fr) auto}
  .tabs{grid-column:1/-1;grid-row:2;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .userbox{grid-column:2}
  .grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:30px 14px}
}
@media(max-width:700px){
  .shell{padding:0 12px 24px}
  .topbar{grid-template-columns:1fr auto;gap:10px;padding-top:10px}
  .userbox .globe,.clock{display:none}
  .tabs{justify-content:flex-start;gap:4px}
  .tab{padding:9px 11px}
  .library-line{margin-bottom:14px;align-items:center}
  .library-title p{display:none}
  .sort span{display:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 10px}
  .detail-card{grid-template-columns:110px 1fr;gap:13px;padding:15px}
  .detail-info h2{font-size:18px}
  .detail-cover{align-self:start}
}
@media(max-width:430px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .profile{width:32px;height:32px}
  .search input{font-size:15px}
}
</style>
</head>
<body>
<div id="ambient" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar">
    <label class="search"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Szukaj gier..." autocomplete="off"></label>
    <nav class="tabs" id="tabs" aria-label="Sekcje biblioteki"></nav>
    <div class="userbox"><span class="globe">●</span><span class="clock" id="clock">--:--</span><div class="profile" title="shinhati">S</div></div>
  </header>

  <div class="library-line">
    <div class="library-title"><h1 id="sectionTitle">WSZYSTKIE GRY</h1><p id="subline">Układ inspirowany Steam Big Picture. Statusy nadal są ustawiane tylko w pliku games.js.</p></div>
    <label class="sort"><span>SORTUJ</span><select id="sort" aria-label="Sortowanie"><option value="name" selected>NAZWA A–Z</option><option value="hours">CZAS GRY ↓</option><option value="rating">OCENA ↓</option></select></label>
  </div>

  <main class="grid" id="grid"></main>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <button class="detail-close" id="detailClose" aria-label="Zamknij">×</button>
  <div class="detail-card">
    <img class="detail-cover" id="detailCover" alt="">
    <div class="detail-info"><h2 id="detailTitle"></h2><p id="detailMeta"></p><div class="detail-tags" id="detailTags"></div><p>Status gry jest pobierany wyłącznie z <b>games.js</b>. Strona nie zmienia go i nie zapisuje niczego lokalnie.</p><div class="detail-actions"><a class="action" id="steamLink" target="_blank" rel="noopener noreferrer">OTWÓRZ W STEAM</a><button class="action secondary" id="closeBtn" type="button">WRÓĆ</button></div></div>
  </div>
</div>

<script src="games.js"></script>
<script>
(()=>{
const games=Array.isArray(window.STEAM_GAMES)?window.STEAM_GAMES:[];
const grid=document.getElementById('grid');
const tabs=document.getElementById('tabs');
const search=document.getElementById('search');
const sort=document.getElementById('sort');
const sectionTitle=document.getElementById('sectionTitle');
const subline=document.getElementById('subline');
const detail=document.getElementById('detail');
const detailClose=document.getElementById('detailClose');
const closeBtn=document.getElementById('closeBtn');
const ambient=document.getElementById('ambient');
let active='all';
let ambientTimer=null;

function setAmbientFromCard(card){
  const img=card.querySelector('.cover');
  if(!img)return;
  clearTimeout(ambientTimer);
  const src=img.currentSrc||img.src;
  if(!src)return;
  ambient.style.setProperty('--ambient-image',`url("${src.replace(/"/g,'%22')}")`);
  ambient.style.setProperty('--ambient-opacity','.62');
}
function clearAmbientSoon(){
  clearTimeout(ambientTimer);
  ambientTimer=setTimeout(()=>ambient.style.setProperty('--ambient-opacity','0'),180);
}
const hoursValue=v=>{
  if(!v||v==='-')return -1;
  const h=String(v).match(/[\d,.]+(?=h)/);
  if(h)return parseFloat(h[0].replace(/,/g,''));
  const m=String(v).match(/(\d+)m/);
  return m?parseInt(m[1],10)/60:0;
};
const ratingValue=v=>{
  const n=parseFloat(String(v||'').replace('%',''));
  return Number.isFinite(n)?n:-1;
};
const isUpcoming=g=>g.playtime==='-';
const effectiveStatus=g=>g.status==='done'?'done':'todo';
const tabDefs=[
  ['all','WSZYSTKIE GRY',()=>true],
  ['done','UKOŃCZONE',g=>effectiveStatus(g)==='done'],
  ['favorites','ULUBIONE',g=>!!g.favorite]
];
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cssUrlEscape(s){
  return String(s).replace(/'/g,'%27').replace(/\)/g,'%29');
}
function counts(){
  return Object.fromEntries(tabDefs.map(([id,,fn])=>[id,games.filter(fn).length]));
}
function renderTabs(){
  const c=counts();
  tabs.innerHTML=tabDefs.map(([id,label])=>`<button class="tab${active===id?' active':''}" data-tab="${id}" type="button">${label}<span>${c[id]}</span></button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;render()}));
}
function candidates(g){
  return [
    `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${g.appid}/library_600x900.jpg`,
    `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/library_600x900.jpg`,
    `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${g.appid}/library_600x900.jpg`,
    `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${g.appid}/library_capsule.jpg`
  ];
}
function coverImg(g,cls='cover'){
  const arr=candidates(g);
  const first=arr.shift();
  return `<img class="${cls}" src="${first}" alt="${escapeHtml(g.name)}" loading="lazy" data-fallback='${escapeHtml(JSON.stringify(arr))}'>`;
}
function doneBadge(g){
  return effectiveStatus(g)==='done'?'<span class="badge-done" title="Ukończona" aria-hidden="true"></span>':'';
}
function gameCard(g){
  const glow=candidates(g)[0];
  return `<article class="game" tabindex="0" data-appid="${g.appid}" aria-label="${escapeHtml(g.name)}"><div class="cover-wrap"><div class="color-glow" style="background-image:url('${cssUrlEscape(glow)}')"></div><div class="cover-clip">${coverImg(g)}</div>${g.favorite?'<span class="favorite" title="Ulubiona">★</span>':''}${doneBadge(g)}</div></article>`;
}
function filtered(){
  const def=tabDefs.find(x=>x[0]===active)||tabDefs[0];
  const q=search.value.trim().toLocaleLowerCase('pl');
  let arr=games.filter(def[2]);
  if(q)arr=arr.filter(g=>g.name.toLocaleLowerCase('pl').includes(q));
  arr=[...arr];
  if(sort.value==='rating')arr.sort((a,b)=>ratingValue(b.rating)-ratingValue(a.rating)||a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));
  else if(sort.value==='hours')arr.sort((a,b)=>hoursValue(b.playtime)-hoursValue(a.playtime)||a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));
  else arr.sort((a,b)=>a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));
  return arr;
}
function wireFallbacks(){
  grid.querySelectorAll('img[data-fallback]').forEach(img=>img.addEventListener('error',function(){
    let rest=[];
    try{rest=JSON.parse(img.dataset.fallback||'[]')}catch{}
    if(rest.length){
      img.src=rest.shift();
      img.dataset.fallback=JSON.stringify(rest);
    }else{
      const div=document.createElement('div');
      div.className='fallback';
      div.textContent=img.alt;
      img.replaceWith(div);
    }
  }));
}
function render(){
  renderTabs();
  const label=(tabDefs.find(x=>x[0]===active)||tabDefs[0])[1];
  sectionTitle.textContent=label;
  const arr=filtered();
  const total=games.length;
  subline.textContent=search.value.trim()?`Znaleziono ${arr.length} z ${total} gier.`:`${arr.length} gier w widoku • domyślne sortowanie: nazwa A–Z.`;
  grid.innerHTML=arr.length?arr.map(gameCard).join(''):'<div class="empty">Brak gier w tym widoku.</div>';
  wireFallbacks();
  grid.querySelectorAll('.game').forEach(card=>{
    const open=()=>showDetail(Number(card.dataset.appid));
    card.addEventListener('click',open);
    card.addEventListener('mouseenter',()=>setAmbientFromCard(card));
    card.addEventListener('mouseleave',clearAmbientSoon);
    card.addEventListener('focus',()=>setAmbientFromCard(card));
    card.addEventListener('blur',clearAmbientSoon);
    card.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        open();
      }
    });
  });
}
function showDetail(appid){
  const g=games.find(x=>x.appid===appid);
  if(!g)return;
  document.getElementById('detailTitle').textContent=g.name;
  document.getElementById('detailMeta').textContent=`${g.playtime==='-'?'Brak czasu gry':g.playtime+' na koncie'}${g.rating!=='-'?'  •  '+g.rating+' pozytywnych ocen':''}`;
  const tags=[];
  if(g.status==='done')tags.push('<span class="chip done">UKOŃCZONA</span>');
  else if(isUpcoming(g))tags.push('<span class="chip">NADCHODZĄCA</span>');
  else tags.push('<span class="chip">W BIBLIOTECE</span>');
  tags.push(`<span class="chip">APP ${g.appid}</span>`);
  if(g.favorite)tags.push('<span class="chip">★ ULUBIONA</span>');
  document.getElementById('detailTags').innerHTML=tags.join('');
  const img=document.getElementById('detailCover');
  const arr=candidates(g);
  img.src=arr.shift();
  img.alt=g.name;
  img.onerror=()=>{if(arr.length)img.src=arr.shift();else img.onerror=null};
  document.getElementById('steamLink').href=`https://store.steampowered.com/app/${g.appid}/`;
  detail.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetail(){
  detail.classList.remove('open');
  document.body.style.overflow='';
}
detailClose.addEventListener('click',closeDetail);
closeBtn.addEventListener('click',closeDetail);
detail.addEventListener('click',e=>{if(e.target===detail)closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detail.classList.contains('open'))closeDetail()});
search.addEventListener('input',render);
sort.addEventListener('change',render);
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
tick();
setInterval(tick,30000);
render();
})();
</script>
</body>
</html>
